<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ON · dashboard</title>
<style>
  /* dark chart chrome from the dataviz reference palette: categorical slots for series, status colours for states, ink tokens for every label */
  :root {
    --page: #0d0d0d; --surface: #1a1a19; --surface2: #222220; --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.10);
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --critical: #d03b3b;
    --on: #1c3a63; --rail: 330px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); font: 12px/1.35 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  body { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100vh; }
  @media (max-width: 1250px) { :root { --rail: 296px; } }
  :focus-visible { outline: 2px solid var(--c1); outline-offset: 1px; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--grid); background: var(--surface); min-width: 0; }
  header .who { min-width: 0; flex: 0 1 auto; }
  header .song { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .sub { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .grow { flex: 1; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--ring); color: var(--ink2); white-space: nowrap; background: transparent; font: inherit; }
  .chip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  button.chip { cursor: pointer; } button.chip:hover { border-color: var(--muted); }
  button.chip.on { border-color: var(--c1); background: var(--on); color: #fff; }
  button.chip.pin { border-color: var(--c4); color: var(--ink); }
  .num { font-variant-numeric: tabular-nums; }
  aside { overflow-y: auto; border-right: 1px solid var(--grid); background: var(--surface); padding: 2px 0 40px; }
  main { overflow-y: auto; padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; align-content: start; }
  details { border-bottom: 1px solid var(--grid); }
  summary { cursor: pointer; padding: 8px 14px; font-weight: 600; color: var(--ink); list-style: none; display: flex; justify-content: space-between; user-select: none; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: '+'; color: var(--muted); }
  details[open] > summary::after { content: '−'; }
  .grp { padding: 2px 14px 10px; display: grid; gap: 6px; }
  .row { display: grid; grid-template-columns: 104px minmax(0, 1fr) 40px; align-items: center; gap: 8px; }
  .row label { color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row output { text-align: right; color: var(--ink2); }
  .changed > label::before, .pinned > label::before { content: '• '; color: var(--c1); }
  .changed > label, .pinned > label { color: var(--ink); } .pinned > label::before { color: var(--c4); }
  input[type=range] { width: 100%; accent-color: var(--c1); margin: 0; }
  select, button, input[type=number], input[type=text], textarea { background: var(--surface2); color: var(--ink); border: 1px solid var(--axis); border-radius: 6px; padding: 4px 8px; font: inherit; }
  select { min-width: 0; width: 100%; }
  button { cursor: pointer; } button:hover { border-color: var(--muted); }
  button.on { border-color: var(--c1); color: #fff; background: var(--on); }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 2px 7px; background: transparent; color: var(--muted); }
  .seg button.on { background: var(--on); color: #fff; }
  .seg button + button { border-left: 1px solid var(--axis); }
  .sw { display: grid; grid-template-columns: 104px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  .sw label { color: var(--ink2); }
  .sw input[type=color] { width: 100%; height: 24px; border: 1px solid var(--axis); border-radius: 6px; background: none; padding: 0; }
  .sub2 { color: var(--muted); }
  input.bad { border-color: var(--critical); }
  .panel { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; min-width: 0; }
  .panel > h2 { margin: 0; padding: 9px 12px; font-size: 12px; font-weight: 600; display: flex; gap: 8px; align-items: center; color: var(--ink); cursor: pointer; user-select: none; }
  .panel > h2::before { content: ''; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg) translate(-2px, -2px); transition: transform .12s; }
  .panel.collapsed > h2::before { transform: rotate(-45deg); }
  .panel > h2 span { color: var(--muted); font-weight: 400; margin-left: auto; }
  .panel > .body { padding: 0 12px 12px; }
  .panel.collapsed > .body { display: none; }
  .panel.wide { grid-column: 1 / -1; }
  canvas { width: 100%; display: block; }
  .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px 10px; margin-top: 4px; }

  .bar span { color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .bar span.win { color: var(--ink); font-weight: 600; } .bar em { font-style: normal; text-align: right; color: var(--ink2); }
  .bar i { height: 8px; background: var(--grid); border-radius: 0 4px 4px 0; overflow: hidden; display: block; }
  .bar i u { display: block; height: 100%; border-radius: 0 4px 4px 0; transition: width .12s; }
  .layer { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 8px; align-items: center; margin: 3px 0; }
  .layer span { color: var(--ink2); } .layer span.win { color: var(--ink); font-weight: 600; }
  .layer i { height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; display: block; } .layer i u { display: block; height: 100%; background: var(--c1); transition: width .12s; }
  .layer .seg button { font-size: 10px; }
  .gname { color: var(--muted); margin: 8px 0 2px; }
  .log { font: 11px/1.5 Consolas, ui-monospace, monospace; color: var(--ink2); max-height: 180px; overflow: auto; white-space: pre-wrap; }
  .skingrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .skinimg { width: 100%; border-radius: 6px; display: block; aspect-ratio: 2 / 1; background: var(--surface2); object-fit: cover; }
  .stains { display: flex; gap: 6px; margin-top: 8px; } .stains div { flex: 1; height: 18px; border-radius: 4px; border: 1px solid var(--ring); }
  .tip { position: fixed; pointer-events: none; background: #000d; border: 1px solid var(--axis); border-radius: 6px; padding: 3px 7px; color: #fff; font-size: 11px; display: none; z-index: 9; white-space: nowrap; }
  .empty { color: var(--muted); padding: 30px; grid-column: 1 / -1; text-align: center; }
  textarea { width: 100%; height: 80px; resize: vertical; font: 11px Consolas, monospace; }
  .frozen header { box-shadow: inset 0 -2px 0 var(--warn); }
  .hear { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 4px 22px; }
  .hear h3 { margin: 10px 0 4px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: none; letter-spacing: 0; }
  .hear .bar { grid-template-columns: 150px minmax(0, 1fr) 40px; }
  .hear .bar span small { color: var(--muted); font-size: 10px; margin-left: 4px; }
  .hearbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 2px; }
  .hearbar .sub2 { margin-left: auto; }
  .pinlist { display: grid; gap: 4px; } .pinlist .row { grid-template-columns: 1fr auto; }
</style>
</head>
<body>
<header>
  <div class="who"><div class="song" id="song">—</div><div class="sub" id="songsub">waiting for the being</div></div>
  <div class="grow"></div>
  <button class="chip pin" id="ovr" title="Clear all overrides" hidden></button>
  <span class="chip" id="feel">—</span>
  <span class="chip" id="state"><i></i><b>—</b></span>
  <span class="chip num" id="perf">— fps</span>

</header>

<aside id="rail">

  <details data-id="skinctl" open><summary>Skin</summary><div class="grp" id="skinctl"></div></details>
  <details data-id="systems"><summary>Systems</summary><div class="grp" id="systems"></div></details>
  <details data-id="actions"><summary>Actions</summary><div class="grp"><div class="btns" id="actions"></div></div></details>
  <details data-id="rhythmctl"><summary>Rhythm</summary><div class="grp" id="rhythmctl"></div></details>
  <details data-id="experimental"><summary>Experimental</summary><div class="grp" id="experimental"></div></details>
  <details data-id="developer"><summary>Developer</summary>
    <details data-id="tuning" open><summary>Tuning</summary><div class="grp"><input type="text" id="find" placeholder="Find a control" aria-label="Find a control" autocomplete="off"></div></details>
    <div id="tune"></div>
    <details data-id="presets"><summary>Presets</summary><div class="grp" id="presets"></div></details>
    <details data-id="uniforms"><summary>Uniforms</summary><div class="grp" id="uniforms"></div></details>
  </details>
</aside>

<main id="live">
  <div class="empty" id="empty">Waiting for the being…</div>
</main>
<div class="tip" id="tip"></div>

<script>
