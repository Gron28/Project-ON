                          (the 12 vertices of an icosahedron, walked so neighbours in the circle of fifths are neighbours in
                          space: a chord makes one lump, never a flat star). Each lobe has its note's hue.

   lead                -> the core light: radius and brightness, and it OPENS thin spots in the shell so light pushes out;
                          when voice is high the light "sings" with a small vibrato wobble
   kick                -> core flash, every lobe jolts outward, the shell breathes, and a droplet is launched
   snare               -> shockwave ring, and a smaller droplet
   hat                 -> spike shimmer (and now and then a tiny droplet)
   pads                -> halo size and the density of the motes
   falling drops       -> percussive energy: each hit launches a droplet from a random direction on a shell around the mass;
                          they fall in with some swirl and coalesce into the mass (speed from energy and tempo)
   beat grid           -> with confidence > ~0.3 the whole entity pulses on every beat (pow(1 - phase, 4)), more on downbeats,
                          sways left/right on alternate beats, and the whole mass turns a small step on every bar.
                          With low confidence it falls back to purely reactive (kick) motion

                          in, then a new form. 'section': smooth hue rotation of the note colours (+0.15) and a new form
